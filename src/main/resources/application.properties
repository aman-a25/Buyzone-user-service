spring.application.name=user-service

server.port = 8082


# DB configuration
spring.datasource.url=jdbc:mysql://localhost:3306/buyzone_user_service?createDatabaseIfNotExist=true
spring.datasource.username = root
spring.datasource.password = Admin@123

# Granting DDL permissions to hibernate
spring.jpa.hibernate.ddl-auto = update

# All the queries run by hibernate will be shown
spring.jpa.show-sql = true 


# Spring Security Configuration

#username
spring.security.user.name = aman

#password
spring.security.user.password = Admin@123

#ROLE (Optional)
spring.security.user.role = ADMIN